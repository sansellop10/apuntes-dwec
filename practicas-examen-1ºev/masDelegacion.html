<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio rápido - Etiquetas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    .barra { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; }
    li.urgente { border-color: #dc2626; background: #fef2f2; }
    li.oculta { display: none; }
  </style>
</head>
<body>
  <div class="barra">
    <input type="text" id="filtro-texto" placeholder="Filtrar..." />
    <button type="button" id="btn-urgentes">Solo urgentes: OFF</button>
    <span>Activas: <strong id="total-activas">3</strong></span>
    <button type="button" id="btn-limpiar">Limpiar</button>
  </div>

  <ul id="lista">
    <li data-urgente="true"><span>Revisar PR</span><button type="button" class="btn-quitar">×</button></li>
    <li data-urgente="false"><span>Leer documentación</span><button type="button" class="btn-quitar">×</button></li>
    <li data-urgente="true"><span>Arreglar bug de login</span><button type="button" class="btn-quitar">×</button></li>
  </ul>

  <script>
    const lista = document.getElementById("lista");
    const totalActivas = document.getElementById("total-activas");
    const btnUrgentes = document.getElementById("btn-urgentes");
    const input = document.getElementById("filtro-texto");
    const btnLimpiar = document.getElementById("btn-limpiar");

    function actualizarContador(){
        let li = document.querySelectorAll("li")
        let ocultos = document.querySelectorAll("#lista li.oculta");
        totalActivas.textContent = li.length - ocultos.length
    }
    
    function cambiarSoloUrgente(){
        let soloUrgentes = false;
        
        function cambiar(){
            soloUrgentes = !soloUrgentes;
        }
        function estaActivo(){
            return soloUrgentes;
        }
        function reset(){
            soloUrgentes = false
        }
        return{
            cambiar, estaActivo, reset
        }
    }

    function filtrar(){
        let li = document.querySelectorAll("li");
        let busqueda = input.value.trim().toLowerCase()
        let soloUrgente = soloUrgentes.estaActivo()
        li.forEach(tarea=>{
            let titulo = tarea.querySelector("span").textContent.trim().toLowerCase();

            const esUrgente = tarea.dataset.urgente === "true";

            const urgenteEncontrado = !soloUrgente || esUrgente;
            let buscadoEncontrado = titulo.includes(busqueda);
            let encontrado = buscadoEncontrado && urgenteEncontrado
            tarea.classList.toggle("oculta", !encontrado)
        });
        actualizarContador()

    }

    let soloUrgentes = cambiarSoloUrgente();

    input.addEventListener("input", function(){
        filtrar()
    });
    btnLimpiar.addEventListener("click", function(){
        input.value="";
        soloUrgentes.reset()
        cambiarNombreBoton()
        filtrar()

    });
    function cambiarNombreBoton(){
        let texto = btnUrgentes.textContent
        let activo = "Solo urgentes: ON"
        let desactivo = "Solo urgentes: OFF"

        soloUrgentes.estaActivo() ? 
        btnUrgentes.textContent = activo : 
        btnUrgentes.textContent = desactivo;
    }
    btnUrgentes.addEventListener("click", function(){
        soloUrgentes.cambiar()
        cambiarNombreBoton()
        filtrar()
    });
    
    lista.addEventListener("click", (event)=>{
        if(event.target.closest(".btn-quitar")){
            let li = event.target.closest("li");
            li.remove()
            actualizarContador()
        }else if(event.target.closest("span")){
            let li = event.target.closest("li");
            let urgencia = li.dataset.urgente;  
    
            
            if(urgencia==="true"){
                li.dataset.urgente = "false";
            }else{
                li.dataset.urgente ="true";
            }
    
            filtrar()
            
        }
    });
  </script>
</body>
</html>
